version: "3.8"

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000" # API порт
      - "9001:9001" # Консоль управления
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./storage/minio:/data
    command: server /data --console-address ":9001"
    networks:
      - minio-network

networks:
  minio-network:
    driver: bridge
